<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1c16" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="leafGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leafGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="92" stroke="#10b981" stroke-opacity="0.35" stroke-width="8" fill="none" />
  
  <!-- Left Leaf -->
  <path d="M256 420 C180 340 100 300 100 200 C100 120 180 60 256 60 C230 180 220 280 256 420 Z" fill="url(#leafGradLeft)" />
  <!-- Right Leaf -->
  <path d="M256 420 C332 340 412 300 412 200 C412 120 332 60 256 60 C282 180 292 280 256 420 Z" fill="url(#leafGradRight)" opacity="0.95" />
  
  <!-- Center Sprout / Corn Ear -->
  <path d="M256 60 Q290 180 280 320 Q256 360 232 320 Q222 180 256 60 Z" fill="url(#centerGrad)" filter="url(#glow)" />
  <!-- Center Spine -->
  <line x1="256" y1="60" x2="256" y2="420" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Agricultural Tech Nodes -->
  <circle cx="256" cy="60" r="14" fill="#ffffff" stroke="#10b981" stroke-width="4" />
  <circle cx="160" cy="220" r="12" fill="#34d399" />
  <circle cx="352" cy="220" r="12" fill="#fbbf24" />
</svg>
