<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    
    <!-- Primary Title & SEO -->
    <title>AgroGuard PWA - Smart Crop Growth & Disease Detector</title>
    <meta name="title" content="AgroGuard PWA - Smart Crop Growth & Disease Detector" />
    <meta name="description" content="AI-Powered Progressive Web App for Crop Growth Stage Estimation, Disease Detection, Weather Advisories, Spray Window Radar, and Farm Lifecycle Management." />
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme & Color Meta -->
    <meta name="theme-color" content="#059669" />
    <meta name="msapplication-TileColor" content="#0a0f1d" />
    <meta name="msapplication-navbutton-color" content="#059669" />
    
    <!-- Apple iOS PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AgroGuard" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <!-- Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/icons/favicon.png" />

    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <noscript>
      <div style="padding: 24px; text-align: center; color: white; background: #0b1c16; min-height: 100vh; font-family: sans-serif;">
        <h2>AgroGuard PWA requires JavaScript to run.</h2>
        <p>Please enable JavaScript in your browser settings to access real-time crop analysis and farm management tools.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
